[project]
name = "Integrated_Code_Fire"
version = "0.2.0"
description = "Integrated Code 火 is a monospaced programming font with CJK languages. | 简化字 | 日本 | 한국인 | 香港 | 台灣"
readme = "README.md"
requires-python = ">=3.14"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
maintainers = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
dependencies = [
  "afdko>=5.0.1",
  "fontmake>=3.11.1",
  "fonttools>=4.61.1",
  "glyphslib>=6.12.7",
  "hunterMakesPy>=0.8.1",
  "more-itertools>=11.1.0",
  "tqdm>=4.67.3",
  "z0z-tools>=3.2.4",
]

[project.urls]
Documentation = "https://github.com/hunterhogan/Integrated_code_fire_font/blob/main/README.md"
Donate = "https://www.patreon.com/integrated"
Homepage = "https://github.com/hunterhogan/Integrated_code_fire_font"
Issues = "https://github.com/hunterhogan/Integrated_code_fire_font/issues"
Repository = "https://github.com/hunterhogan/Integrated_code_fire_font.git"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = {} }
package-data = { Integrated_Code_Fire = ["*.cmd", "py.typed"], "Integrated_Code_Fire.dataCenter" = ["*.gids", "*.unicodes"] }
